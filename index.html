<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>隨手記</title>
  <meta name="description" content="待辦、筆記、行程三合一，同步到專案管理工具、OneNote 與 iPhone 行事曆">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="隨手記">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // 在畫面出現前先套用上次的配色，避免閃一下預設色
    try {
      var t = JSON.parse(localStorage.getItem('tte.theme'));
      if (t) {
        document.documentElement.dataset.mode = t.mode;
        for (var k in t.vars) document.documentElement.style.setProperty(k, t.vars[k]);
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>請開啟 JavaScript。</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
